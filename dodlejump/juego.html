<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoJump - Juego</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #071d35;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at top, rgba(88, 204, 2, 0.18), transparent 35%),
                linear-gradient(180deg, #0b2d4a 0%, #061425 100%);
        }

        canvas {
            display: block;
            width: min(96vw, 720px);
            height: auto;
            max-height: 94vh;
            border: 4px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.45);
            background: #071d35;
        }
    </style>
</head>
<body>

    <script type="module" src="./game.js"></script>

</body>
</html>
